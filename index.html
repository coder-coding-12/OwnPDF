<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF Creator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP TOOLBAR -->
    <header class="toolbar">

        <!-- Add button -->
        <div class="toolbar-left">

            <button class="icon-button" id="addButton" title="Add images">
                +
            </button>

            <div class="divider"></div>

            <button class="icon-button" id="undoButton" title="Undo">
                ↶
            </button>

            <button class="icon-button" id="redoButton" title="Redo">
                ↷
            </button>

            <button class="icon-button delete-button" id="deleteButton" title="Delete selected">
                🗑️
            </button>

            <!-- Paper size -->
            <select id="pageSize">
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
                <option value="a3">A3</option>
            </select>

            <!-- Orientation -->
            <select id="orientation">
                <option value="auto">Auto</option>
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
            </select>

            <!-- Margins -->
            <select id="margins">
                <option value="small">Small margins</option>
                <option value="none">No margins</option>
                <option value="large">Large margins</option>
            </select>

        </div>


        <!-- TOP RIGHT -->
        <div class="toolbar-right">

            <label class="toggle-container">

                <input type="checkbox" id="separatePdfs">

                <span class="toggle"></span>

                <span>Separate PDFs</span>

            </label>


            <button class="finish-button" id="finishButton">
                Finish <span>→</span>
            </button>

        </div>

    </header>


    <!-- MAIN WORKSPACE -->
    <main class="workspace">

        <div class="workspace-top">

            <label class="select-all">
                <input type="checkbox" id="selectAll">
                <span>Select all</span>
            </label>


            <div class="view-controls">

                <button id="sortButton" class="sort-button">
                    <span>↓</span> A Z
                    <span class="arrow">⌄</span>
                </button>

                <button class="view-button">
                    ☷
                </button>

                <button class="view-button active">
                    ▦
                </button>

            </div>

        </div>


        <!-- IMAGE GRID -->
        <div id="imageGrid" class="image-grid">


            <!-- Empty state -->
            <div class="empty-card" id="emptyCard">

                <div class="empty-plus">
                    +
                </div>

                <div>
                    <strong>Add images</strong>
                    <br>
                    to start creating your PDF
                </div>

            </div>


        </div>

    </main>


    <!-- FILE INPUT -->
    <input
        type="file"
        id="imageInput"
        accept="image/png,image/jpeg,image/jpg"
        multiple
        hidden
    >


    <!-- PDF LIBRARY -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
