<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF Creator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Image to PDF</h1>

        <p>Convert your images into a PDF</p>

        <label for="imageInput" class="upload-btn">
            + Add Images
        </label>

        <input
            type="file"
            id="imageInput"
            accept=".png,.jpg,.jpeg"
            multiple
            hidden
        >

        <p class="sorting-info">
            Drag and drop the images to change their order.
        </p>

        <div id="preview"></div>

        <button id="createPdf" disabled>
            Create PDF
        </button>

        <a id="downloadPdf" style="display: none;">
            Download PDF
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
